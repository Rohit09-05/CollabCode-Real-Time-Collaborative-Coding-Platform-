name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: collabcode_test
          MYSQL_USER: collabcode
          MYSQL_PASSWORD: testpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 4000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: collabcode_test
      DB_USER: collabcode
      DB_PASSWORD: testpass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: test_access_secret_must_be_at_least_32_chars_long
      JWT_REFRESH_SECRET: test_refresh_secret_must_be_at_least_32_chars_long
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Lint
        run: npm run lint || true
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Lint
        run: npm run lint || true
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ── Docker build check ────────────────────────────────────────────────────────
  docker:
    name: Docker Compose — Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Create backend .env from example
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/REPLACE_WITH_STRONG_SECRET_64_CHARS/ci_access_secret_placeholder_at_least_32_chars/g' backend/.env
          sed -i 's/REPLACE_WITH_DIFFERENT_STRONG_SECRET_64_CHARS/ci_refresh_secret_placeholder_at_least_32_chars/g' backend/.env

      - name: Build Docker images
        run: docker compose build --no-cache
