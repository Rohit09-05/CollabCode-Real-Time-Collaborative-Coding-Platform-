version: "3.9"

# Overlay this on top of docker-compose.yml for local development:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences from production:
# - Backend runs with nodemon (hot reload via bind-mount)
# - Frontend runs Vite dev server (hot reload)
# - No production Nginx proxy for frontend (Vite handles that)

services:

  backend:
    build:
      context: ./backend
      target: base
    command: npx nodemon server.js
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules   # prevent host node_modules from overwriting container's

  frontend:
    build:
      context: ./frontend
      target: builder
    command: npx vite --host 0.0.0.0
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
